<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce - Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-white shadow">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-indigo-600">MiTienda</a>
            <div class="space-x-4">
                <a href="index.html" class="text-gray-600 hover:text-indigo-600">Home</a>
                <a href="catalogo.html" class="text-indigo-600 font-semibold">Catálogo</a>
                <a href="carrito.html" class="text-gray-600 hover:text-indigo-600">Carrito</a>
            </div>
        </nav>
    </header>

    <main class="flex-grow container mx-auto px-6 py-8 flex flex-col md:flex-row gap-8">
        <!-- Barra de filtros -->
        <aside class="w-full md:w-1/4 bg-white p-6 rounded-lg shadow h-fit">
            <h3 class="font-bold text-lg mb-4 text-indigo-600">Filtros</h3>
            <div class="mb-6">
                <h4 class="font-semibold text-sm mb-2 text-gray-700">Categoría</h4>
                <label class="block text-sm mb-1"><input type="checkbox" class="mr-2"> Calzado</label>
                <label class="block text-sm mb-1"><input type="checkbox" class="mr-2"> Ropa</label>
                <label class="block text-sm mb-1"><input type="checkbox" class="mr-2"> Accesorios</label>
            </div>
            <div>
                <h4 class="font-semibold text-sm mb-2 text-gray-700">Talla</h4>
                <label class="block text-sm mb-1"><input type="checkbox" class="mr-2"> S</label>
                <label class="block text-sm mb-1"><input type="checkbox" class="mr-2"> M</label>
                <label class="block text-sm mb-1"><input type="checkbox" class="mr-2"> L</label>
                <label class="block text-sm mb-1"><input type="checkbox" class="mr-2"> XL</label>
            </div>
        </aside>

        <!-- Rejilla de productos (ej. disposición amplia) -->
        <section class="w-full md:w-3/4">
            <h2 class="text-2xl font-bold mb-6">Catálogo General</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Repetir elementos de ejemplo -->
                <div class="bg-white p-4 rounded-lg shadow">
                    <div class="bg-gray-200 h-48 rounded mb-4 flex items-center justify-center text-gray-400">Imagen Producto</div>
                    <h3 class="font-semibold">Camiseta Deportiva</h3>
                    <p class="text-indigo-600 font-bold mt-2">$29.99</p>
                    <a href="producto.html" class="mt-4 block text-center bg-indigo-50 text-indigo-600 py-2 rounded hover:bg-indigo-100">Ver detalle</a>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <div class="bg-gray-200 h-48 rounded mb-4 flex items-center justify-center text-gray-400">Imagen Producto</div>
                    <h3 class="font-semibold">Pantalón Casual</h3>
                    <p class="text-indigo-600 font-bold mt-2">$49.99</p>
                    <a href="producto.html" class="mt-4 block text-center bg-indigo-50 text-indigo-600 py-2 rounded hover:bg-indigo-100">Ver detalle</a>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <div class="bg-gray-200 h-48 rounded mb-4 flex items-center justify-center text-gray-400">Imagen Producto</div>
                    <h3 class="font-semibold">Zapatillas Urbanas</h3>
                    <p class="text-indigo-600 font-bold mt-2">$79.99</p>
                    <a href="producto.html" class="mt-4 block text-center bg-indigo-50 text-indigo-600 py-2 rounded hover:bg-indigo-100">Ver detalle</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        &copy; 2026 MiTienda. Todos los derechos reservados.
    </footer>
</body>
</html>
