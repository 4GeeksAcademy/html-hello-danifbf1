<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce - Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-white shadow">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-indigo-600">MiTienda</a>
            <div class="space-x-4">
                <a href="index.html" class="text-gray-600 hover:text-indigo-600">Home</a>
                <a href="catalogo.html" class="text-gray-600 hover:text-indigo-600">Catálogo</a>
                <a href="carrito.html" class="text-gray-600 hover:text-indigo-600">Carrito</a>
            </div>
        </nav>
    </header>

    <main class="flex-grow container mx-auto px-6 py-8 max-w-2xl">
        <h2 class="text-2xl font-bold mb-6 text-center">Finalizar Compra (Checkout)</h2>
        
        <form class="bg-white p-8 rounded-lg shadow space-y-6">
            <!-- Paso 1: Datos personales -->
            <div>
                <h3 class="text-lg font-semibold mb-3 text-indigo-600 border-b pb-1">1. Datos Personales</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input type="text" placeholder="Nombre completo" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="email" placeholder="Correo electrónico" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- Paso 2: Dirección de entrega -->
            <div>
                <h3 class="text-lg font-semibold mb-3 text-indigo-600 border-b pb-1">2. Dirección de Entrega</h3>
                <input type="text" placeholder="Dirección completa (Calle, número, piso)" class="border p-2 rounded w-full mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input type="text" placeholder="Ciudad" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="text" placeholder="Código Postal" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- Paso 3: Pago con tarjeta -->
            <div>
                <h3 class="text-lg font-semibold mb-3 text-indigo-600 border-b pb-1">3. Pago con Tarjeta</h3>
                <input type="text" placeholder="Número de tarjeta (4532 •••• •••• ••••)" class="border p-2 rounded w-full mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" placeholder="MM/AA" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="text" placeholder="CVV" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg shadow hover:bg-indigo-700 transition">Confirmar y Pagar</button>
        </form>
    </main>

    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        &copy; 2026 MiTienda. Todos los derechos reservados.
    </footer>
</body>
</html>
